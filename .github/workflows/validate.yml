name: Locked declarative artifact verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-update-lock-file -L
      - name: Build artifacts and verify outside checkout
        run: |
          source_root=$PWD
          nix build --no-update-lock-file
          cd "$RUNNER_TEMP"
          nix run --no-update-lock-file "$source_root#verify"
